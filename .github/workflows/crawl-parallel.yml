name: Coleta diaria de anuncios

# Coleta executada localmente pelo Agendador do Windows. O workflow fica sem
# eventos de agenda ou disparo manual para evitar execucoes concorrentes.
on:
  push:
    branches: ["__workflow_disabled__"]

permissions:
  contents: read

jobs:
  crawl:
    if: ${{ false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GOOGLE_SHEETS_CREDENTIALS_JSON: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS_JSON }}
      GOOGLE_SHEETS_ID: ${{ secrets.GOOGLE_SHEETS_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar navegadores do Playwright
        run: npx --workspace=@captacao/crawlers playwright install --with-deps chromium

      - name: Aplicar migrations pendentes
        run: npm run migrate

      - name: Atualizar cadastro dos sites monitorados
        run: npm run seed:sites

      - name: Rodar crawlers ativos por grupos de plataforma
        run: npm run crawl:all

      - name: Sincronizar planilha Google Sheets
        if: always()
        run: npm run sheets:sync
