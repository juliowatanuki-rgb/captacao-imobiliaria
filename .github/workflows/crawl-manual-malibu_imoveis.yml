name: Coleta manual - Malibu Imoveis

# Workflow manual e isolado para um unico site (secao 18: erro em um site
# nunca deve afetar outro - aqui isso vale tambem no nivel do workflow, cada
# site tem o seu proprio, rodado independentemente via workflow_dispatch).
on:
  workflow_dispatch:
    inputs:
      site_id:
        description: "Slug do site em monitored_sites (nao alterar, exceto para depuracao pontual)"
        required: true
        default: "malibu_imoveis"
        type: string

permissions:
  contents: read

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar navegadores do Playwright
        run: npx --workspace=@captacao/crawlers playwright install --with-deps chromium

      - name: Aplicar migrations pendentes
        run: npm run migrate

      - name: Rodar crawler do site
        run: npm run crawl:site -w @captacao/crawlers -- ${{ inputs.site_id }}
