name: Coleta diaria de anuncios

# Secao 17: execucao automatica via GitHub Actions, sem depender de
# computador pessoal ou servidor proprio. Repositorio publico para nao
# consumir minutos limitados de repositorio privado.
on:
  schedule:
    - cron: "0 9 * * *" # 09:00 UTC = 06:00 America/Sao_Paulo
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar navegadores do Playwright
        run: npx --workspace=@captacao/crawlers playwright install --with-deps chromium

      - name: Aplicar migrations pendentes
        run: npm run migrate

      # Sites homologados (1a + 2a coleta ja confirmadas contra o Neon: 0
      # duplicidade, 0 novos indevidos). Rodados um de cada vez (sequencial,
      # nao em paralelo) - resource contention entre browsers concorrentes ja
      # causou falso-vazio de scraping em execucoes anteriores desta sessao.
      # Erro em um site nao impede os demais (crawlSite isola por site -
      # secao 18) - por isso cada `crawl:site` roda em um step separado, com
      # `if: always()` para os seguintes rodarem mesmo se um anterior falhar.
      #
      # NAO adicionar aqui sites que ainda nao passaram pela 2a coleta de
      # confirmacao no Neon (hoje: tempone_imoveis_pg, dema_imoveis,
      # group_house_fort, praialar_imoveis, all_prime_imoveis e os demais
      # ainda so em dry-run) - use o workflow manual isolado de cada site
      # pra validar antes de mover para ca.
      - name: Rodar crawler - Casa Paris Imoveis
        run: npm run crawl:site -w @captacao/crawlers -- casa_paris_imoveis

      - name: Rodar crawler - Imigrantes Imoveis
        if: always()
        run: npm run crawl:site -w @captacao/crawlers -- imigrantes_imoveis

      - name: Rodar crawler - Tavares e Polati Imoveis
        if: always()
        run: npm run crawl:site -w @captacao/crawlers -- tavares_e_polati_imoveis

      - name: Rodar crawler - Igor Braga Imoveis
        if: always()
        run: npm run crawl:site -w @captacao/crawlers -- igor_braga_imoveis

      - name: Rodar crawler - Plaza Imoveis
        if: always()
        run: npm run crawl:site -w @captacao/crawlers -- plaza_imoveis

      - name: Rodar crawler - M2M Imoveis
        if: always()
        run: npm run crawl:site -w @captacao/crawlers -- m2m_imoveis

      - name: Rodar crawler - Nova Casarao Imoveis
        if: always()
        run: npm run crawl:site -w @captacao/crawlers -- nova_casarao_imoveis

      - name: Rodar crawler - Alpha Imoveis PG
        if: always()
        run: npm run crawl:site -w @captacao/crawlers -- alpha_imoveis_pg

      - name: Rodar crawler - Feliciano Imoveis Praia Grande
        if: always()
        run: npm run crawl:site -w @captacao/crawlers -- feliciano_imoveis_praia_grande

      - name: Rodar crawler - Micheletto Consultoria de Imoveis
        if: always()
        run: npm run crawl:site -w @captacao/crawlers -- micheletto_consultoria_imoveis

      - name: Rodar crawler - Damasco Imoveis
        if: always()
        run: npm run crawl:site -w @captacao/crawlers -- damasco_imoveis

      - name: Rodar crawler - Realizacao Imoveis
        if: always()
        run: npm run crawl:site -w @captacao/crawlers -- realizacao_imoveis

      - name: Rodar crawler - Morada na Praia Imoveis
        if: always()
        run: npm run crawl:site -w @captacao/crawlers -- morada_na_praia_imoveis

      - name: Rodar crawler - Aline Caetano Imoveis
        if: always()
        run: npm run crawl:site -w @captacao/crawlers -- aline_caetano_imoveis

      - name: Rodar crawler - Nova Kennedy
        if: always()
        run: npm run crawl:site -w @captacao/crawlers -- nova_kennedy
