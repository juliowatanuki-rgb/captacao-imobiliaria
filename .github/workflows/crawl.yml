name: Coleta diaria de anuncios

# Secao 17: execucao automatica via GitHub Actions, sem depender de
# computador pessoal ou servidor proprio. Repositorio publico para nao
# consumir minutos limitados de repositorio privado.
on:
  # Auditoria de 2026-08-05: horario movido pra madrugada (era 09:00 UTC =
  # 06:00 America/Sao_Paulo, que na pratica so comecava a rodar mais tarde
  # por fila do runner e ja invadia o horario comercial, ainda mais sem
  # terminar dentro do timeout - ver timeout-minutes abaixo). 05:00 UTC = 02:00
  # America/Sao_Paulo, com folga de sobra pra terminar antes do expediente.
  schedule:
    - cron: "0 5 * * *" # 05:00 UTC = 02:00 America/Sao_Paulo
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  crawl:
    runs-on: ubuntu-latest
    # Era 120 - a coleta sequencial de ~40 sites vem passando disso ha dias
    # (confirmado no historico do Actions: toda execucao agendada desde
    # 2026-07-31 foi cancelada pelo proprio GitHub por estourar o timeout,
    # sempre por volta de 2h05). 240 da folga real, com margem.
    timeout-minutes: 240
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GOOGLE_SHEETS_CREDENTIALS_JSON: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS_JSON }}
      GOOGLE_SHEETS_ID: ${{ secrets.GOOGLE_SHEETS_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar navegadores do Playwright
        run: npx --workspace=@captacao/crawlers playwright install --with-deps chromium

      - name: Aplicar migrations pendentes
        run: npm run migrate

      # Sites homologados (1a + 2a coleta ja confirmadas contra o Neon: 0
      # duplicidade, 0 novos indevidos). Rodados um de cada vez (sequencial,
      # nao em paralelo) - resource contention entre browsers concorrentes ja
      # causou falso-vazio de scraping em execucoes anteriores desta sessao.
      # Erro em um site nao impede os demais (crawlSite isola por site -
      # secao 18) - por isso cada `crawl:site` roda em um step separado, com
      # `if: always()` para os seguintes rodarem mesmo se um anterior falhar.
      #
      # NAO adicionar aqui sites que ainda nao passaram pela 2a coleta de
      # confirmacao no Neon (hoje: all_prime_imoveis) - use o workflow
      # manual isolado de cada site pra validar antes de mover para ca.
      - name: Rodar crawler - Casa Paris Imoveis
        run: npm run crawl:site -w @captacao/crawlers -- casa_paris_imoveis

      - name: Rodar crawler - Imigrantes Imoveis
        if: always()
        run: npm run crawl:site -w @captacao/crawlers -- imigrantes_imoveis

      - name: Rodar crawler - Tavares e Polati Imoveis
        if: always()
        run: npm run crawl:site -w @captacao/crawlers -- tavares_e_polati_imoveis

      - name: Rodar crawler - Igor Braga Imoveis
        if: always()
        run: npm run crawl:site -w @captacao/crawlers -- igor_braga_imoveis

      - name: Rodar crawler - Plaza Imoveis
        if: always()
        run: npm run crawl:site -w @captacao/crawlers -- plaza_imoveis

      - name: Rodar crawler - M2M Imoveis
        if: always()
        run: npm run crawl:site -w @captacao/crawlers -- m2m_imoveis

      - name: Rodar crawler - Nova Casarao Imoveis
        if: always()
        run: npm run crawl:site -w @captacao/crawlers -- nova_casarao_imoveis

      - name: Rodar crawler - Alpha Imoveis PG
        if: always()
        run: npm run crawl:site -w @captacao/crawlers -- alpha_imoveis_pg

      - name: Rodar crawler - Feliciano Imoveis Praia Grande
        if: always()
        run: npm run crawl:site -w @captacao/crawlers -- feliciano_imoveis_praia_grande

      - name: Rodar crawler - Micheletto Consultoria de Imoveis
        if: always()
        run: npm run crawl:site -w @captacao/crawlers -- micheletto_consultoria_imoveis

      - name: Rodar crawler - Damasco Imoveis
        if: always()
        run: npm run crawl:site -w @captacao/crawlers -- damasco_imoveis

      - name: Rodar crawler - Realizacao Imoveis
        if: always()
        run: npm run crawl:site -w @captacao/crawlers -- realizacao_imoveis

      - name: Rodar crawler - Morada na Praia Imoveis
        if: always()
        run: npm run crawl:site -w @captacao/crawlers -- morada_na_praia_imoveis

      - name: Rodar crawler - Aline Caetano Imoveis
        if: always()
        run: npm run crawl:site -w @captacao/crawlers -- aline_caetano_imoveis

      - name: Rodar crawler - Nova Kennedy
        if: always()
        run: npm run crawl:site -w @captacao/crawlers -- nova_kennedy

      - name: Rodar crawler - Tempone Imoveis PG
        if: always()
        run: npm run crawl:site -w @captacao/crawlers -- tempone_imoveis_pg

      - name: Rodar crawler - Dema Imoveis
        if: always()
        run: npm run crawl:site -w @captacao/crawlers -- dema_imoveis

      - name: Rodar crawler - Group House Fort
        if: always()
        run: npm run crawl:site -w @captacao/crawlers -- group_house_fort

      - name: Rodar crawler - Praialar Imoveis
        if: always()
        run: npm run crawl:site -w @captacao/crawlers -- praialar_imoveis

      # Removido da coleta diaria em 2026-08-05: sozinho levava ~39 min pra
      # achar so 52 anuncios em 150 paginas (paginacao/retentativas
      # ineficientes), puxando a execucao inteira pra cima do timeout. Fica
      # desativado em monitored_sites.ativo tambem - reativar so depois de
      # investigar e corrigir o motor desse site especificamente.
      # - name: Rodar crawler - Realize Inteligencia Imobiliaria
      #   if: always()
      #   run: npm run crawl:site -w @captacao/crawlers -- realize_inteligencia_imobiliaria

      - name: Rodar crawler - Marco Hottz Imoveis
        if: always()
        run: npm run crawl:site -w @captacao/crawlers -- marco_hottz_imoveis

      - name: Rodar crawler - Alo Imoveis Baixada
        if: always()
        run: npm run crawl:site -w @captacao/crawlers -- alo_imoveis_baixada

      - name: Rodar crawler - Aetherna Empreendimentos
        if: always()
        run: npm run crawl:site -w @captacao/crawlers -- aetherna_empreendimentos

      - name: Rodar crawler - Quintal de Areia Imoveis
        if: always()
        run: npm run crawl:site -w @captacao/crawlers -- quintal_de_areia_imoveis

      - name: Rodar crawler - Marise Gomes Moreira Imoveis
        if: always()
        run: npm run crawl:site -w @captacao/crawlers -- marise_gomes_moreira_imoveis

      - name: Rodar crawler - Debora Santos Imoveis
        if: always()
        run: npm run crawl:site -w @captacao/crawlers -- debora_santos_imoveis

      - name: Rodar crawler - MSA Investimento Imobiliario
        if: always()
        run: npm run crawl:site -w @captacao/crawlers -- msa_investimento_imobiliario

      - name: Rodar crawler - Bueno Santos Imoveis
        if: always()
        run: npm run crawl:site -w @captacao/crawlers -- bueno_santos_imoveis

      - name: Rodar crawler - Safira Imoveis Praia Grande
        if: always()
        run: npm run crawl:site -w @captacao/crawlers -- safira_imoveis_praia_grande

      - name: Rodar crawler - Spinola Consultoria Imobiliaria
        if: always()
        run: npm run crawl:site -w @captacao/crawlers -- spinola_consultoria_imobiliaria

      - name: Rodar crawler - Ape na PG Imobiliaria
        if: always()
        run: npm run crawl:site -w @captacao/crawlers -- ape_na_pg_imobiliaria

      - name: Rodar crawler - Debora Bueno Consultoria
        if: always()
        run: npm run crawl:site -w @captacao/crawlers -- debora_bueno_consultoria

      - name: Rodar crawler - Grupo MR Solucoes Imobiliarias
        if: always()
        run: npm run crawl:site -w @captacao/crawlers -- grupo_mr_solucoes_imobiliarias

      - name: Rodar crawler - Nova Geracao Imoveis Praia
        if: always()
        run: npm run crawl:site -w @captacao/crawlers -- nova_geracao_imoveis_praia

      - name: Rodar crawler - Imoveis de Classe
        if: always()
        run: npm run crawl:site -w @captacao/crawlers -- imoveis_de_classe

      - name: Rodar crawler - Central Imoveis Praia Grande
        if: always()
        run: npm run crawl:site -w @captacao/crawlers -- central_imoveis_praia_grande

      - name: Rodar crawler - Malibu Imoveis
        if: always()
        run: npm run crawl:site -w @captacao/crawlers -- malibu_imoveis

      - name: Rodar crawler - Prime Imoveis PG
        if: always()
        run: npm run crawl:site -w @captacao/crawlers -- prime_imoveis_pg

      - name: Rodar crawler - Nova CPI
        if: always()
        run: npm run crawl:site -w @captacao/crawlers -- nova_cpi

      - name: Rodar crawler - Costa do Sol Imobiliaria
        if: always()
        run: npm run crawl:site -w @captacao/crawlers -- costa_do_sol_imobiliaria

      # Homologado em 2026-08-05: 1a coleta achou 680 imoveis reais (dados
      # limpos, extracao validada ao vivo), mas a 2a coleta de confirmacao
      # (rodada poucos minutos depois, junto de outros testes manuais no
      # mesmo site) foi bloqueada por verificacao anti-bot (Cloudflare
      # "Human Verification") - aparenta ser gatilho por excesso de
      # requisicoes em pouco tempo, nao um bloqueio permanente. No ritmo de
      # 1 coleta/dia isso deve ser raro; a protecao de queda suspeita
      # (secao 18) ja evita gravar dado incorreto se falhar de novo. Se
      # falhar repetidamente na coleta diaria, investigar espacamento entre
      # requisicoes/headers antes de manter na lista.
      - name: Rodar crawler - Arthur Paraguay Investimentos
        if: always()
        run: npm run crawl:site -w @captacao/crawlers -- arthur_paraguay_investimentos

      # Homologado em 2026-08-05: 1a coleta achou 600 imoveis reais. A 2a
      # coleta de confirmacao bateu no mesmo bloqueio anti-bot da Praedium
      # (ver Arthur Paraguay acima) - mesmo motivo provavel (varios sites
      # Praedium testados em sequencia rapida). No ritmo de 1 coleta/dia
      # deve ser raro.
      - name: Rodar crawler - Elite Imoveis
        if: always()
        run: npm run crawl:site -w @captacao/crawlers -- elite_imoveis_pg

      # Homologado em 2026-08-05: 1a coleta achou 2698 imoveis, 2a coleta de
      # confirmacao 100% estavel (2698 encontrados, 0 novos, 0 duplicidade).
      - name: Rodar crawler - Agencia da Praia Imoveis
        if: always()
        run: npm run crawl:site -w @captacao/crawlers -- agencia_da_praia_imoveis

      # Cadastrado em 2026-08-05, extracao validada com validate:site (40
      # imoveis limpos, 2 paginas) mas a 1a coleta real bateu no bloqueio
      # anti-bot da Praedium antes de conseguir gravar (testado em sequencia
      # logo apos Elite Imoveis, mesma plataforma/CDN) - ainda SEM nenhum
      # dado gravado no Neon (isInitialSeed continua valendo na proxima
      # tentativa). Mantido no ritmo normal de 1 coleta/dia; primeira
      # execucao bem-sucedida serve de 1a coleta de verdade.
      - name: Rodar crawler - Rios Imoveis
        if: always()
        run: npm run crawl:site -w @captacao/crawlers -- rios_imoveis_pg

      # Exporta 100% dos anuncios (qualquer status) para a planilha do
      # Google Sheets, so acrescentando linhas novas desde a ultima
      # sincronizacao (nunca apaga/reescreve linha existente - secao "Google
      # Sheets" do README). Roda mesmo se algum crawler acima falhar.
      - name: Sincronizar planilha Google Sheets
        if: always()
        run: npm run sheets:sync
